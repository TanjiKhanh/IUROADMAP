# Nightly pg_dump of every service database to a separate volume, kept BACKUP_RETENTION_DAYS days.
# The volume is on the same node: copy the dumps off the server too (README: "Backups").
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  labels:
    app.kubernetes.io/name: postgres-backup
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    app.kubernetes.io/name: postgres-backup
spec:
  schedule: "0 2 * * *"
  timeZone: Asia/Ho_Chi_Minh
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70 # "postgres" user of the alpine image
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:17-alpine
              env:
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secrets
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secrets
                      key: POSTGRES_PASSWORD
                - name: BACKUP_RETENTION_DAYS
                  value: "7"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  dir="/backups/$(date +%Y-%m-%d_%H%M)"
                  mkdir -p "$dir"
                  for db in iuroadmap_auth iuroadmap_roadmap iuroadmap_mentor iuroadmap_user; do
                    pg_dump --format=custom --file="$dir/$db.dump" "$db"
                  done
                  find /backups -mindepth 1 -maxdepth 1 -type d -mtime +"$BACKUP_RETENTION_DAYS" -exec rm -rf {} +
                  ls -lh "$dir"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
