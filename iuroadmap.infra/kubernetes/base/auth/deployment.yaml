apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: backend
spec:
  # No replicas field: 1 on creation, then the HPA of the environment decides (overlays/prod/hpa.yaml)
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/component: backend
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # "node" user of the image
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Schema first, then the app. Prisma takes an advisory lock, so replicas never migrate twice.
        - name: migrate
          image: iuroadmap/auth
          command:
            - sh
            - -c
            - |
              set -e
              npm run prisma:migrate
              # auth has no migration files yet (its schema was applied with `prisma db push`), so sync the
              # schema the same way. Without --accept-data-loss, db push refuses any change that drops data.
              if ! ls prisma/migrations/*/migration.sql >/dev/null 2>&1; then
                npx --no prisma db push --skip-generate
              fi
          envFrom:
            - configMapRef:
                name: auth-config
            - secretRef:
                name: auth-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: auth
          image: iuroadmap/auth
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: auth-config
            - secretRef:
                name: auth-secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Let the endpoint removal reach Traefik before the process stops
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
