# The app, identical in every environment. Each service is its own unit (folder): Deployment, Service,
# ConfigMap, Secret (Terraform), NetworkPolicy, and in prod its own HPA + PDB.
# Images are placeholders (iuroadmap/<service>): scripts/deploy.sh points them at the registry + tag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: iuroadmap
    includeSelectors: false
    includeTemplates: true

resources:
  - auth
  - api-gateway
  - roadmap-service
  - mentor-service
  - user-service
  - web
  - ingress.yaml
  - redirect-https.yaml
  - network-policies.yaml
