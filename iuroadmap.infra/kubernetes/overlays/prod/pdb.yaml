# Keep one pod of each 2-replica service up during node drains (k3s upgrades, maintenance)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: roadmap-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: roadmap-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
