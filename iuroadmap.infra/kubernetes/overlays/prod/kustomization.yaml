# prod environment → namespace iuroadmap-prod (created by terraform/02-platform), branch main.
# DOMAIN: replace iuroadmap.example.com in the 3 places marked below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: iuroadmap-prod

resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml

components:
  - ../../components/postgres

labels:
  - pairs:
      app.kubernetes.io/instance: iuroadmap-prod
    includeSelectors: false

configMapGenerator:
  - name: api-gateway-config
    behavior: merge
    literals:
      - CORS_ORIGIN=https://iuroadmap.example.com # DOMAIN

patches:
  - target:
      kind: Ingress
      name: iuroadmap
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: iuroadmap.example.com # DOMAIN
      - op: replace
        path: /spec/tls/0/hosts/0
        value: iuroadmap.example.com # DOMAIN
      - op: add
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: iuroadmap-prod-redirect-https@kubernetescrd

  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 20Gi

  - target:
      kind: PersistentVolumeClaim
      name: postgres-backups
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 20Gi
